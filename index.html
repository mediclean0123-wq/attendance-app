
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance App</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#22c55e;--red:#ef4444;--blue:#2563eb;}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:18px}
.container{max-width:520px;margin:0 auto}.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
h1,h2{margin:0 0 18px}select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #d1d5db;font-size:16px;margin-bottom:10px;background:#fff}
button{width:100%;padding:18px;border:none;border-radius:14px;font-size:18px;font-weight:700;margin-top:10px;cursor:pointer}
.start{background:var(--green);color:white}.end{background:var(--red);color:white}.export{background:var(--blue);color:white}
.small{color:var(--muted);font-size:14px;line-height:1.6}.summaryText{font-size:17px;line-height:1.9}
.historyList{display:flex;flex-direction:column;gap:12px}.historyItem{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.historyTop{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:10px}.historyGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.label{color:var(--muted);font-size:12px;display:block}.value{font-size:15px;word-break:break-word}.amountPlus{color:#16a34a;font-weight:700}.amountMinus{color:#dc2626;font-weight:700}.empty{color:var(--muted);text-align:center;padding:20px 0}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1 id="title">勤務管理</h1>
<select id="languageSelect" onchange="changeLanguage(this.value)">
<option value="ja">日本語</option><option value="en">English</option><option value="np">नेपाली</option>
</select>
<input type="text" id="staffName" placeholder="スタッフ名">
<div class="small" id="gpsInfo">位置情報を取得中...</div>
<button class="start" id="startBtn" onclick="startWork()">🟢 出勤</button>
<button class="end" id="endBtn" onclick="endWork()">🔴 退勤</button>
<button class="export" id="csvBtn" onclick="downloadCSV()">CSV出力</button>
<div class="small" id="status">未出勤</div>
</div>
<div class="card"><h2 id="summaryTitle">今月の集計</h2><div class="summaryText" id="summary"></div></div>
<div class="card"><h2 id="historyTitle">勤務履歴</h2><div class="historyList" id="history"></div></div>
</div>
<script>
let currentLat="",currentLng="",currentPlace="";let currentLang=localStorage.getItem("lang")||"ja";
const texts={
ja:{title:"勤務管理",staffPlaceholder:"スタッフ名",gettingLocation:"位置情報を取得中...",location:"現在地",locationFailed:"位置情報を取得できませんでした",start:"🟢 出勤",end:"🔴 退勤",csv:"CSV出力",notStarted:"未出勤",working:"出勤中",pleaseStart:"先に出勤してください",summary:"今月の集計",workDays:"稼働日数",offDays:"休日",totalAmount:"合計調整額",history:"勤務履歴",noHistory:"勤務履歴はまだありません",startTime:"開始",endTime:"終了",place:"場所",hours:"超過/不足",csvName:"attendance.csv"},
en:{title:"Attendance",staffPlaceholder:"Staff name",gettingLocation:"Getting location...",location:"Current location",locationFailed:"Could not get location",start:"🟢 START WORK",end:"🔴 END WORK",csv:"CSV EXPORT",notStarted:"Not working",working:"Working",pleaseStart:"Please start work first",summary:"Monthly Summary",workDays:"Work days",offDays:"Off days",totalAmount:"Total adjustment",history:"Work History",noHistory:"No work history yet",startTime:"Start",endTime:"End",place:"Place",hours:"Extra/Short",csvName:"attendance.csv"},
np:{title:"हाजिरी व्यवस्थापन",staffPlaceholder:"कर्मचारीको नाम",gettingLocation:"स्थान प्राप्त गर्दै...",location:"हालको स्थान",locationFailed:"स्थान प्राप्त गर्न सकिएन",start:"🟢 काम सुरु",end:"🔴 काम समाप्त",csv:"CSV डाउनलोड",notStarted:"काम सुरु भएको छैन",working:"काम गर्दै",pleaseStart:"पहिले काम सुरु गर्नुहोस्",summary:"मासिक सारांश",workDays:"काम गरेको दिन",offDays:"बिदा",totalAmount:"कुल समायोजन",history:"कामको इतिहास",noHistory:"अहिले सम्म कुनै इतिहास छैन",startTime:"सुरु",endTime:"समाप्त",place:"स्थान",hours:"थप/कम",csvName:"attendance.csv"}};
function t(k){return texts[currentLang][k]}
function applyLanguage(){document.documentElement.lang=currentLang;languageSelect.value=currentLang;title.innerText=t("title");staffName.placeholder=t("staffPlaceholder");startBtn.innerText=t("start");endBtn.innerText=t("end");csvBtn.innerText=t("csv");summaryTitle.innerText=t("summary");historyTitle.innerText=t("history");if(!localStorage.getItem("working"))status.innerText=t("notStarted");gpsInfo.innerText=currentPlace?`${t("location")}: ${currentPlace}`:t("gettingLocation");render()}
function changeLanguage(lang){currentLang=lang;localStorage.setItem("lang",lang);applyLanguage();getLocation()}
async function reverseGeocode(lat,lng){try{const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=${currentLang}`);const data=await res.json();const a=data.address||{};const parts=[a.city||a.town||a.village||a.suburb||a.city_district||a.municipality,a.road||a.neighbourhood].filter(Boolean);return parts.length?parts.join(" "):(data.display_name||`${lat}, ${lng}`)}catch(e){return`${lat}, ${lng}`}}
function getLocation(){if(!navigator.geolocation){gpsInfo.innerText=t("locationFailed");return}navigator.geolocation.getCurrentPosition(async(pos)=>{currentLat=pos.coords.latitude.toFixed(5);currentLng=pos.coords.longitude.toFixed(5);currentPlace=await reverseGeocode(currentLat,currentLng);gpsInfo.innerText=`${t("location")}: ${currentPlace}`},()=>{gpsInfo.innerText=t("locationFailed")},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
function startWork(){const start=new Date();const staff=staffName.value.trim();localStorage.setItem("staffName",staff);localStorage.setItem("working",JSON.stringify({start:start.toISOString(),lat:currentLat,lng:currentLng,place:currentPlace||`${currentLat}, ${currentLng}`}));status.innerText=`${t("working")}: ${start.toLocaleTimeString()}`}
function calcAdjustment(start,end){const workedHours=(end-start)/(1000*60*60);let diff=workedHours-9,h=0;if(diff>0){h=Math.floor(diff);if(diff-h>=.5)h+=1}else{h=Math.ceil(diff);if(Math.abs(diff-h)>=.5)h-=1}return{workedHours:Number(workedHours.toFixed(2)),adjustmentHours:h,amount:h*1000}}
function endWork(){const raw=localStorage.getItem("working");if(!raw){alert(t("pleaseStart"));return}const data=JSON.parse(raw),end=new Date(),start=new Date(data.start);const c=calcAdjustment(start,end);const record={id:Date.now().toString(),staff:localStorage.getItem("staffName")||staffName.value.trim(),dateISO:new Date().toISOString().slice(0,10),date:new Date().toLocaleDateString(),start:start.toLocaleTimeString(),end:end.toLocaleTimeString(),startISO:start.toISOString(),endISO:end.toISOString(),workedHours:c.workedHours,adjustmentHours:c.adjustmentHours,place:data.place||`${data.lat}, ${data.lng}`,lat:data.lat||"",lng:data.lng||"",amount:c.amount,edited:false,editHistory:[]};let records=JSON.parse(localStorage.getItem("records")||"[]");records.push(record);localStorage.setItem("records",JSON.stringify(records));localStorage.removeItem("working");status.innerText=t("notStarted");render()}
function render(){const records=JSON.parse(localStorage.getItem("records")||"[]");history.innerHTML="";let total=0;records.forEach(r=>total+=Number(r.amount||0));const today=new Date(),ym=today.toISOString().slice(0,7);const monthRecords=records.filter(r=>(r.dateISO||"").slice(0,7)===ym||!r.dateISO);const daysInMonth=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();summary.innerHTML=`${t("workDays")}: ${monthRecords.length}<br>${t("offDays")}: ${daysInMonth-monthRecords.length}<br>${t("totalAmount")}: ¥${total.toLocaleString()}`;if(records.length===0){history.innerHTML=`<div class="empty">${t("noHistory")}</div>`;return}records.slice().reverse().forEach(r=>{const amount=Number(r.amount||0),cls=amount>=0?"amountPlus":"amountMinus";history.innerHTML+=`<div class="historyItem"><div class="historyTop"><div>${r.date}${r.edited?"（修正済）":""}</div><div class="${cls}">¥${amount.toLocaleString()}</div></div><div class="historyGrid"><div><span class="label">${t("startTime")}</span><span class="value">${r.start}</span></div><div><span class="label">${t("endTime")}</span><span class="value">${r.end}</span></div><div><span class="label">${t("hours")}</span><span class="value">${r.adjustmentHours||0}h</span></div><div style="grid-column:1/-1"><span class="label">${t("place")}</span><span class="value">${r.place||""}</span></div></div></div>`})}
function downloadCSV(){const records=JSON.parse(localStorage.getItem("records")||"[]");let csv="Staff,Date,Start,End,WorkedHours,AdjustmentHours,Place,Amount,Edited\n";records.forEach(r=>csv+=`"${r.staff||""}","${r.dateISO||r.date}","${r.start}","${r.end}","${r.workedHours||""}","${r.adjustmentHours||0}","${r.place||""}","${r.amount||0}","${r.edited?'YES':'NO'}"\n`);const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=t("csvName");a.click()}
const savedStaff=localStorage.getItem("staffName");if(savedStaff)staffName.value=savedStaff;applyLanguage();getLocation();
</script<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAPPRrNAR_XIJq8C39odZ4jaSeyJqsKRiY",
    authDomain: "attendance-app-333ba.firebaseapp.com",
    projectId: "attendance-app-333ba",
    storageBucket: "attendance-app-333ba.firebasestorage.app",
    messagingSenderId: "935750890339",
    appId: "1:935750890339:web:386b43200f88dd3e2c1956"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>
</body>
</html>
